<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Metrics Dashboard</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111827;
        --muted-fg: #6b7280;
        --card-bg: #ffffff;
        --card-b: #e5e7eb;
        --input-b: #d1d5db;
        --stat-bg: #f9fafb;
        --code-bg: #f3f4f6;
        --btn-bg: #111827;
        --btn-fg: #ffffff;
      }
      [data-theme="dark"] {
        --bg: #0b1020;
        --fg: #e5e7eb;
        --muted-fg: #94a3b8;
        --card-bg: #0f172a;
        --card-b: #1f2a44;
        --input-b: #334155;
        --stat-bg: #0f172a;
        --code-bg: #0b1222;
        --btn-bg: #2563eb;
        --btn-fg: #ffffff;
      }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 16px;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 16px;
      }
      .card {
        border: 1px solid var(--card-b);
        background: var(--card-bg);
        border-radius: 12px;
        padding: 16px 18px;
      }
      label {
        font-size: 12px;
        color: var(--muted-fg);
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
      }
      select,
      input {
        padding: 8px;
        border: 1px solid var(--input-b);
        border-radius: 8px;
        width: 100%;
        box-sizing: border-box;
        font-size: 14px;
        background: var(--card-bg);
        color: var(--fg);
      }
      button {
        padding: 10px 14px;
        border: 0;
        border-radius: 10px;
        background: var(--btn-bg);
        color: var(--btn-fg);
        cursor: pointer;
      }
      /* Toggle */
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted-fg);
        user-select: none;
        margin-right: 16px; /* ensures spacing from Backoffice button */
      }
      .toggle input {
        appearance: auto;
        -webkit-appearance: checkbox;
        position: static;
        width: auto;
        height: auto;
        vertical-align: middle;
      }
      /* remove old slider styles */
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .stat {
        background: var(--stat-bg);
        border-radius: 8px;
        padding: 10px 12px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 70px;
        position: relative;
      }
      .stat .muted {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted-fg);
        margin-bottom: 4px;
        margin: 0 0 4px 0;
      }
      .stat .v {
        font-size: 20px;
        font-weight: 700;
        margin: 0;
      }
      .stat:nth-child(1) .v {
        color: #3b82f6; /* Blue for Total visits */
      }
      .stat:nth-child(2) .v {
        color: #10b981; /* Green for Avg duration */
      }
      .stat:nth-child(3) .v {
        color: #f59e0b; /* Orange for Days included */
      }
      .stat:nth-child(4) .v {
        color: #8b5cf6; /* Purple for Today visits */
      }
      .stat:nth-child(5) .v {
        color: #ef4444; /* Red for Month visits */
      }
      .stat:nth-child(6) .v {
        color: #06b6d4; /* Cyan for Total duration */
      }
      pre {
        white-space: pre-wrap;
        background: var(--code-bg);
        padding: 10px;
        border-radius: 8px;
      }
      .muted {
        color: var(--muted-fg);
        font-size: 12px;
      }
      canvas {
        max-height: 200px;
        width: 100% !important;
        height: 260px !important;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-group:last-child {
        margin-bottom: 0;
      }
      .error-message {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #dc2626;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 14px;
        margin-top: 8px;
        display: none;
      }
      .error-message.show {
        display: block;
      }
      @media (max-width: 900px) {
        .row {
          grid-template-columns: 1fr;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
      /* Spinner styles - colorful variants */
      .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(59, 130, 246, 0.3);
        border-radius: 50%;
        border-top-color: #3b82f6;
        animation: spin 0.8s linear infinite;
      }
      .spinner.spinner-1 {
        border-color: rgba(59, 130, 246, 0.3);
        border-top-color: #3b82f6; /* Blue */
      }
      .spinner.spinner-2 {
        border-color: rgba(16, 185, 129, 0.3);
        border-top-color: #10b981; /* Green */
      }
      .spinner.spinner-3 {
        border-color: rgba(245, 158, 11, 0.3);
        border-top-color: #f59e0b; /* Orange */
      }
      .spinner.spinner-4 {
        border-color: rgba(139, 92, 246, 0.3);
        border-top-color: #8b5cf6; /* Purple */
      }
      .spinner.spinner-5 {
        border-color: rgba(239, 68, 68, 0.3);
        border-top-color: #ef4444; /* Red */
      }
      .spinner.spinner-6 {
        border-color: rgba(6, 182, 212, 0.3);
        border-top-color: #06b6d4; /* Cyan */
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-overlay {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100px;
        color: var(--muted-fg);
        font-size: 14px;
      }
      .loading-overlay .spinner {
        margin-right: 8px;
      }
    </style>
    <!-- Chart.js (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  </head>
  <body>
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      "
    >
      <h1 style="margin: 0">Metrics Dashboard</h1>
      <div style="display: flex; align-items: center; gap: 12px">
        <div class="toggle" title="Toggle dark mode">
          <label style="display: flex; align-items: center; gap: 8px">
            <input id="themeToggle" type="checkbox" />
            <span>Dark mode</span>
          </label>
        </div>
        <button
          onclick="window.location.href='backoffice.html'"
          style="
            padding: 8px 16px;
            background: #6b7280;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
          "
        >
          📊 Backoffice
        </button>
      </div>
    </div>

    <div class="row">
      <div class="card">
        <div class="form-group">
          <div class="row" style="grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 0;">
            <div>
              <label>App</label>
              <select id="app"></select>
            </div>
            <div>
              <label>API key (auto-fills from config)</label>
              <input id="apiKey" placeholder="x-api-key if required" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Date range (for stats)</label>
          <div class="row" style="grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end;">
            <input id="from" type="date" />
            <input id="to" type="date" />
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <label style="font-size: 11px; margin-bottom: 0;">Auto-refresh</label>
              <select id="refreshInterval" style="width: 80px; padding: 8px;">
                <option value="2000">2 sec</option>
                <option value="5000">5 sec</option>
                <option value="10000" selected>10 sec</option>
                <option value="20000">20 sec</option>
                <option value="0">Off</option>
              </select>
            </div>
          </div>
        </div>

        <div style="height: 10px"></div>
        <button id="load" style="
          padding: 10px 20px;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: white;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          font-size: 14px;
          font-weight: 600;
          box-shadow: 0 4px 6px rgba(102, 126, 234, 0.3);
          transition: all 0.2s ease;
        " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 12px rgba(102, 126, 234, 0.4)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 6px rgba(102, 126, 234, 0.3)'">📊 Load metrics</button>
        <div class="error-message" id="errorMessage"></div>

        <!-- Real-time status -->
        <div style="margin-top: 16px">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 12px;
            "
          >
            <h3 style="margin: 0; font-size: 16px">Real-time Status</h3>
          </div>
          <div id="realtimeStatus">
            <div class="loading-overlay">
              <span class="spinner spinner-3"></span>
              <span>Loading active sessions...</span>
            </div>
          </div>
        </div>

        <!-- Device Types and Top Countries combined - moved here to reduce spacing -->
        <div class="card" id="analyticsCard" style="margin-top: 16px; display: block;">
          <div class="row" style="grid-template-columns: 1fr 1fr; gap: 16px">
            <div id="deviceCard" style="text-align: center; display: block;">
              <label>Device Types (Active Sessions)</label>
              <div id="deviceChartLoading" class="loading-overlay">
                <span class="spinner spinner-4"></span>
                <span>Loading...</span>
              </div>
              <canvas id="deviceChart" height="160" style="display: none;"></canvas>
            </div>
            <div id="countryCard" style="display: block;">
              <label>Top countries</label>
              <div id="countryChartLoading" class="loading-overlay">
                <span class="spinner spinner-5"></span>
                <span>Loading...</span>
              </div>
              <canvas id="countryChart" height="160" style="display: none;"></canvas>
            </div>
          </div>
        </div>

        <!-- Avg Duration per Day Chart -->
        <div class="card" id="avgDurationCard" style="margin-top: 16px; display: none;">
          <label>Avg Duration per Day</label>
          <div id="avgDurationChartLoading" class="loading-overlay">
            <span class="spinner spinner-6"></span>
            <span>Loading chart...</span>
          </div>
          <canvas id="avgDurationChart" height="180" style="display: none;"></canvas>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px">
        <!-- Combined metrics in one row -->
        <div class="card grid" id="metricsCard">
          <div class="stat">
            <div class="muted">Total visits</div>
            <div class="v" id="totalVisits">
              <span class="spinner spinner-1"></span>
            </div>
          </div>
          <div class="stat">
            <div class="muted">Avg duration</div>
            <div class="v" id="avgDur">
              <span class="spinner spinner-2"></span>
            </div>
          </div>
          <div class="stat">
            <div class="muted">Days included</div>
            <div class="v" id="daysCount">
              <span class="spinner spinner-3"></span>
            </div>
          </div>
          <div class="stat">
            <div class="muted">Today visits</div>
            <div class="v" id="todayVisits">
              <span class="spinner spinner-4"></span>
            </div>
          </div>
          <div class="stat">
            <div class="muted">Month visits</div>
            <div class="v" id="monthVisits">
              <span class="spinner spinner-5"></span>
            </div>
          </div>
          <div class="stat">
            <div class="muted">Total duration</div>
            <div class="v" id="totalDuration">
              <span class="spinner spinner-6"></span>
            </div>
          </div>
        </div>

        <!-- Visits chart -->
        <div class="card" id="dailyCard">
          <label>Visits</label>
          <div id="dailyChartLoading" class="loading-overlay">
            <span class="spinner"></span>
            <span>Loading chart...</span>
          </div>
          <canvas id="dailyChart" height="220" style="display: none;"></canvas>
        </div>

        <!-- Per-hour chart -->
        <div class="card" id="hourCard">
          <label>Per-hour (pick a day)</label>
          <select id="daySelect" style="display: none;"></select>
          <div id="hourChartLoading" class="loading-overlay">
            <span class="spinner spinner-2"></span>
            <span>Loading chart...</span>
          </div>
          <div style="height: 8px"></div>
          <canvas id="hourChart" height="220" style="display: none;"></canvas>
        </div>
      </div>
    </div>

    <div class="card">
      <details>
        <summary>Raw response</summary>
        <pre id="raw">—</pre>
      </details>
    </div>

    <script>
      /** ====== CONFIG ======
       * If you have /v1/apps endpoint, the app list auto-loads.
       * Otherwise, set a manual list here:
       */
      const CONFIG = {
        baseUrl: "https://metrics-server-yjqf.onrender.com/v1", // Remote Render server
        // Optional: map known app -> api key, will auto-fill on selection:
        appKeys: {
          repairman: "rKey123",
          electrician: "eKey456",
          profile: "pKey789",
        },
        // Fallback apps list if /v1/apps is not available:
        fallbackApps: ["repairman", "electrician", "profile"],
      };

      // Load API keys from database
      async function loadApiKeys() {
        try {
          const response = await httpGet(`${CONFIG.baseUrl}/api-keys`);
          CONFIG.appKeys = { ...CONFIG.appKeys, ...response.apiKeys };
        } catch (error) {
          console.log(
            "Could not load API keys from database, using hardcoded keys"
          );
        }
      }

      /** ====== DOM ====== */
      const appEl = document.getElementById("app");
      const apiKeyEl = document.getElementById("apiKey");
      const fromEl = document.getElementById("from");
      const toEl = document.getElementById("to");
      const loadBtn = document.getElementById("load");
      const refreshIntervalEl = document.getElementById("refreshInterval");
      const totalEl = document.getElementById("totalVisits");
      const avgEl = document.getElementById("avgDur");
      const daysEl = document.getElementById("daysCount");
      const todayEl = document.getElementById("todayVisits");
      const monthEl = document.getElementById("monthVisits");
      const totalDurEl = document.getElementById("totalDuration");
      const rawEl = document.getElementById("raw");
      const daySelect = document.getElementById("daySelect");
      const errorEl = document.getElementById("errorMessage");
      const realtimeStatusEl = document.getElementById("realtimeStatus");

      let dailyChart, hourChart, deviceChart, countryChart, avgDurationChart;
      let refreshIntervalId = null;
      const PALETTE = [
        "#60a5fa",
        "#f472b6",
        "#34d399",
        "#f59e0b",
        "#a78bfa",
        "#fca5a5",
        "#22d3ee",
        "#c084fc",
        "#fb923c",
        "#86efac",
      ];

      /** ====== helpers ====== */
      const fmtMs = (ms) => {
        if (!ms && ms !== 0) return "—";
        const s = Math.round(ms / 1000);
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const r = s % 60;
        
        if (h > 0) {
          // Show hours and minutes for large values
          return m > 0 ? `${h}h ${m}m ${r}s` : `${h}h ${r}s`;
        } else if (m > 0) {
          // Show minutes and seconds for medium values
          return r > 0 ? `${m}m ${r}s` : `${m}m`;
        } else {
          // Show only seconds for small values
          return `${r}s`;
        }
      };
      const httpGet = async (url, key) => {
        const headers = key ? { "x-api-key": key } : {};
        console.log("Making GET request to:", url, "with headers:", headers);
        try {
          const res = await fetch(url, { headers });
          console.log("Response status:", res.status, res.statusText);
          if (!res.ok) {
            let errorMsg = `HTTP ${res.status}`;
            if (res.status === 401) {
              errorMsg =
                "API key required or invalid. Please check your API key configuration.";
            } else if (res.status === 403) {
              errorMsg = "Access forbidden. API key may be invalid or expired.";
            } else if (res.status === 404) {
              errorMsg = "App not found. Please check the app name.";
            } else if (res.status >= 500) {
              errorMsg = "Server error. Please try again later.";
            }
            // Add debug info for status endpoint
            if (url.includes("/status")) {
              errorMsg += ` (Status endpoint: ${res.status})`;
            }
            const errorText = await res.text().catch(() => "");
            console.error("Error response body:", errorText);
            throw new Error(errorMsg);
          }
          const data = await res.json();
          console.log("Response data:", data);
          return data;
        } catch (error) {
          console.error("Fetch error:", error);
          throw error;
        }
      };

      const httpPost = async (url, key, body) => {
        const headers = {
          "Content-Type": "application/json",
          ...(key ? { "x-api-key": key } : {}),
        };
        console.log("Making POST request to:", url, "with body:", body, "headers:", headers);
        try {
          const res = await fetch(url, {
            method: "POST",
            headers,
            body: JSON.stringify(body),
          });
          console.log("POST Response status:", res.status, res.statusText);
          if (!res.ok) {
            let errorMsg = `HTTP ${res.status}`;
            if (res.status === 401) {
              errorMsg =
                "API key required or invalid. Please check your API key configuration.";
            } else if (res.status === 403) {
              errorMsg = "Access forbidden. API key may be invalid or expired.";
            } else if (res.status === 404) {
              errorMsg = "App not found. Please check the app name.";
            } else if (res.status >= 500) {
              errorMsg = "Server error. Please try again later.";
            }
            const errorText = await res.text().catch(() => "");
            console.error("POST Error response body:", errorText);
            throw new Error(errorMsg);
          }
          // Handle 204 No Content responses
          if (res.status === 204) {
            return null;
          }
          const data = await res.json().catch(() => null);
          console.log("POST Response data:", data);
          return data;
        } catch (error) {
          console.error("POST Fetch error:", error);
          throw error;
        }
      };

      const showError = (message) => {
        errorEl.textContent = message;
        errorEl.classList.add("show");
      };

      const hideError = () => {
        errorEl.classList.remove("show");
        errorEl.textContent = "";
      };

      // Clean session function
      const cleanSession = async (sessionId, app) => {
        const key = apiKeyEl.value || undefined;
        try {
          await httpPost(
            `${CONFIG.baseUrl}/${encodeURIComponent(app)}/end`,
            key,
            {
              sessionId: sessionId,
            }
          );
          // Refresh the real-time status after cleaning
          await loadRealtimeStatus();
        } catch (error) {
          console.error("Failed to clean session:", error);
          showError(`Failed to clean session: ${error.message}`);
        }
      };

      const loadRealtimeStatus = async (showSpinners = true) => {
        const app = appEl.value;
        const key = apiKeyEl.value || undefined;

        if (!app) {
          realtimeStatusEl.innerHTML =
            '<div class="muted">Please select an app to view real-time status.</div>';
          return;
        }
        
        // Show loading spinner (only if showSpinners is true)
        if (showSpinners) {
          realtimeStatusEl.innerHTML = '<div class="loading-overlay"><span class="spinner spinner-3"></span><span>Loading active sessions...</span></div>';
          
          // Show loading for charts
          document.getElementById("deviceChartLoading").style.display = "flex";
          document.getElementById("deviceChart").style.display = "none";
          document.getElementById("countryChartLoading").style.display = "flex";
          document.getElementById("countryChart").style.display = "none";
        }

        try {
          const data = await httpGet(
            `${CONFIG.baseUrl}/${encodeURIComponent(app)}/status`,
            key
          );

          if (data.activeSessions === 0) {
            realtimeStatusEl.innerHTML =
              '<div class="muted">No active sessions</div>';
            return;
          }

          const sessionsHtml = `
            <div style="overflow-x: auto;">
              <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
                <thead>
                  <tr style="background: #f9fafb; border-bottom: 2px solid #e5e7eb;">
                    <th style="padding: 8px; text-align: left; font-weight: 600; color: #374151;">Session ID</th>
                    <th style="padding: 8px; text-align: left; font-weight: 600; color: #374151;">IP Address</th>
                    <th style="padding: 8px; text-align: left; font-weight: 600; color: #374151;">Device Type</th>
                    <th style="padding: 8px; text-align: left; font-weight: 600; color: #374151;">Country</th>
                    <th style="padding: 8px; text-align: left; font-weight: 600; color: #374151;">City</th>
                    <th style="padding: 8px; text-align: left; font-weight: 600; color: #374151;">Status</th>
                    <th style="padding: 8px; text-align: left; font-weight: 600; color: #374151;">Duration</th>
                    <th style="padding: 8px; text-align: left; font-weight: 600; color: #374151;">Last Seen</th>
                    <th style="padding: 8px; text-align: left; font-weight: 600; color: #374151;">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${data.sessions
                    .map((session) => {
                      const statusColor =
                        session.secondsSinceLastSeen < 60
                          ? "#10b981"
                          : session.secondsSinceLastSeen < 300
                          ? "#f59e0b"
                          : "#ef4444";
                      const statusText =
                        session.secondsSinceLastSeen < 60
                          ? "Active"
                          : session.secondsSinceLastSeen < 300
                          ? "Idle"
                          : "Stale";

                      const deviceIcon =
                        session.deviceType === "mobile"
                          ? "📱"
                          : session.deviceType === "tablet"
                          ? "📱"
                          : "💻";

                      const deviceTypeText = session.deviceType || "Unknown";
                      const deviceDisplay = `${deviceIcon} ${deviceTypeText}`;

                      return `
                        <tr style="border-bottom: 1px solid #e5e7eb;">
                          <td style="padding: 8px; font-family: monospace; font-weight: 600;">${session.sessionId.slice(
                            0,
                            8
                          )}...</td>
                          <td style="padding: 8px; font-family: monospace;">${
                            session.ipAddress || "Unknown"
                          }</td>
                          <td style="padding: 8px;">${deviceDisplay}</td>
                          <td style="padding: 8px;">${
                            session.country || "Unknown"
                          }</td>
                          <td style="padding: 8px;">${
                            session.city || "Unknown"
                          }</td>
                          <td style="padding: 8px;">
                            <span style="color: ${statusColor}; font-weight: 600;">${statusText}</span>
                          </td>
                          <td style="padding: 8px;">${fmtMs(
                            session.sessionDurationSeconds * 1000
                          )}</td>
                          <td style="padding: 8px;">${
                            session.secondsSinceLastSeen
                          }s ago</td>
                          <td style="padding: 8px;">
                            ${
                              statusText === "Idle" || statusText === "Stale"
                                ? `<button onclick="cleanSession('${session.sessionId}', '${app}')" style="padding: 4px 8px; background: #f59e0b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600;">Clean</button>`
                                : "—"
                            }
                          </td>
                        </tr>
                      `;
                    })
                    .join("")}
                </tbody>
              </table>
            </div>
          `;

          // expose latest sessions for analytics fallback and immediate charts
          window.lastStatusSessions = data.sessions || [];

          realtimeStatusEl.innerHTML = `
            <div style="margin-bottom: 12px;">
              <span style="font-size: 14px; font-weight: 600;">${
                data.activeSessions
              } active session${data.activeSessions !== 1 ? "s" : ""}</span>
            </div>
            ${sessionsHtml}
          `;

          // Build charts immediately from active sessions data (synchronous, no try-catch delay)
          const sessions = window.lastStatusSessions || [];
          const byType = new Map();
          const byLocation = new Map();
          
          sessions.forEach((s) => {
            const t = String(s.deviceType || s.device_type || "unknown")
              .trim()
              .toLowerCase();
            const country = String(s.country || "").trim();
            const city = String(s.city || "").trim();
            
            // Only include if both country and city are not "unknown" and not empty
            if (country && city && country.toLowerCase() !== "unknown" && city.toLowerCase() !== "unknown") {
              const locationKey = `${country}, ${city}`;
              byLocation.set(locationKey, (byLocation.get(locationKey) || 0) + 1);
            }
            
            byType.set(t, (byType.get(t) || 0) + 1);
          });
          
          const typeCounts = Array.from(byType.entries()).map(
            ([device_type, count]) => ({
              device_type,
              unique_sessions: count,
            })
          );
          const countryCounts = Array.from(byLocation.entries()).map(
            ([location, count]) => ({ 
              country: location.split(", ")[0],
              city: location.split(", ")[1],
              visits: count 
            })
          );
          
          // Build charts immediately - they'll handle visibility
          try {
            buildDeviceChart(typeCounts);
            buildCountryChart(countryCounts);
          } catch (err) {
            console.error("Error building charts from sessions:", err);
          }
        } catch (e) {
          // Handle specific error cases
          if (e.message.includes("API key required")) {
            realtimeStatusEl.innerHTML = `
              <div style="color: #f59e0b; font-size: 14px; padding: 8px; background: #fef3c7; border: 1px solid #fbbf24; border-radius: 6px;">
                ⚠️ API key required for "${app}". Please configure an API key for this app to view real-time status.
              </div>
            `;
          } else {
            realtimeStatusEl.innerHTML = `
              <div style="color: #ef4444; font-size: 14px;">
                Error loading status: ${e.message}
                <br><small style="color: #6b7280;">Debug: URL was ${
                  CONFIG.baseUrl
                }/${encodeURIComponent(app)}/status</small>
              </div>
            `;
          }
        }
      };

      const tryLoadApps = async () => {
        // Try GET /v1/apps if you added that route; else fallback
        try {
          const data = await httpGet(
            CONFIG.baseUrl.replace(/\/v1$/, "/v1/apps"),
            apiKeyEl.value || undefined
          );
          if (Array.isArray(data.apps) && data.apps.length) return data.apps;
        } catch {}
        return CONFIG.fallbackApps;
      };

      const setAppsUI = async () => {
        const apps = await tryLoadApps();
        // Filter out "electric" since we're using "electrician" instead
        const filteredApps = apps.filter(a => a !== "electric");
        appEl.innerHTML = filteredApps
          .map((a) => `<option value="${a}">${a}</option>`)
          .join("");
        // set default key if configured
        const first = appEl.value;
        if (CONFIG.appKeys[first]) apiKeyEl.value = CONFIG.appKeys[first];
      };

      // Function to setup/update auto-refresh interval (defined early for use in event handlers)
      const setupAutoRefresh = () => {
        // Clear existing interval
        if (refreshIntervalId) {
          clearInterval(refreshIntervalId);
          refreshIntervalId = null;
        }

        // Get selected interval
        const intervalMs = parseInt(refreshIntervalEl.value) || 0;
        
        // Set up new interval if not "Off"
        if (intervalMs > 0) {
          refreshIntervalId = setInterval(async () => {
            try {
              // Refresh both stats and real-time status (which includes charts)
              // Pass showSpinners: false to avoid showing spinners during auto-refresh
              await loadStats(false);
              await loadRealtimeStatus(false);
            } catch (error) {
              console.error("Error refreshing data:", error);
            }
          }, intervalMs);
          console.log(`Auto-refresh enabled: ${intervalMs}ms`);
        } else {
          console.log("Auto-refresh disabled");
        }
      };

      appEl.addEventListener("change", async () => {
        const a = appEl.value;
        apiKeyEl.value = CONFIG.appKeys[a] || "";
        
        // Restart auto-refresh with new app
        setupAutoRefresh();
        
        // Reset data display while loading - show colorful spinners
        totalEl.innerHTML = '<span class="spinner spinner-1"></span>';
        avgEl.innerHTML = '<span class="spinner spinner-2"></span>';
        daysEl.innerHTML = '<span class="spinner spinner-3"></span>';
        todayEl.innerHTML = '<span class="spinner spinner-4"></span>';
        monthEl.innerHTML = '<span class="spinner spinner-5"></span>';
        totalDurEl.innerHTML = '<span class="spinner spinner-6"></span>';
        
        if (dailyChart) dailyChart.destroy();
        if (hourChart) hourChart.destroy();
        if (deviceChart) deviceChart.destroy();
        if (countryChart) countryChart.destroy();
        if (avgDurationChart) avgDurationChart.destroy();
        
        // Show loading overlays for charts
        document.getElementById("dailyChartLoading").style.display = "flex";
        document.getElementById("dailyChart").style.display = "none";
        document.getElementById("hourChartLoading").style.display = "flex";
        document.getElementById("hourChart").style.display = "none";
        document.getElementById("daySelect").style.display = "none";
        document.getElementById("deviceChartLoading").style.display = "flex";
        document.getElementById("deviceChart").style.display = "none";
        document.getElementById("countryChartLoading").style.display = "flex";
        document.getElementById("countryChart").style.display = "none";
        document.getElementById("avgDurationChartLoading").style.display = "flex";
        document.getElementById("avgDurationChart").style.display = "none";
        
        daySelect.innerHTML = "";
        realtimeStatusEl.innerHTML = '<div class="loading-overlay"><span class="spinner spinner-3"></span><span>Loading active sessions...</span></div>';
        
        // Step 1: Start session for the app
        await trackAppSession(a);
        
        // Step 2: Load stats (historical aggregated data) after session is started
        await loadStats();
        
        // Step 3: Load status (active sessions) for real-time status section
        await loadRealtimeStatus();
      });


      /** ====== charts ====== */
      const buildDaily = (days) => {
        const labels = days.map((d) => d.day);
        const totals = days.map((d) => d.totalVisits);

        const dailyCard = document.getElementById("dailyCard");
        const dailyChartLoading = document.getElementById("dailyChartLoading");
        const dailyChartCanvas = document.getElementById("dailyChart");
        const hasAny = totals.some((v) => v > 0);
        if (!hasAny) {
          dailyCard.style.display = "none";
          dailyChartLoading.style.display = "none";
          if (dailyChart) dailyChart.destroy();
          return;
        } else {
          dailyCard.style.display = "block";
        }
        if (dailyChart) dailyChart.destroy();
        // Hide loading, show chart
        dailyChartLoading.style.display = "none";
        dailyChartCanvas.style.display = "block";
        const ctx = dailyChartCanvas.getContext("2d");
        dailyChart = new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [
              {
                label: "Visits",
                data: totals,
                backgroundColor: totals.map(
                  (_, i) => PALETTE[i % PALETTE.length]
                ),
                borderColor: totals.map((_, i) => PALETTE[i % PALETTE.length]),
                borderWidth: 1,
                hoverBackgroundColor: "#3b82f6",
                hoverBorderColor: "#2563eb",
                hoverBorderWidth: 2,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                ticks: {
                  precision: 0,
                },
              },
            },
            plugins: {
              legend: {
                display: true,
              },
            },
            interaction: {
              intersect: false,
              mode: "index",
            },
          },
        });
      };

      const buildDeviceChart = (counts) => {
        if (deviceChart) deviceChart.destroy();
        const deviceCard = document.getElementById("deviceCard");
        const analyticsCard = document.getElementById("analyticsCard");
        
        let labels;
        let data;

        // Prefer live sessions when available for accurate current breakdown
        if (
          Array.isArray(window.lastStatusSessions) &&
          window.lastStatusSessions.length > 0
        ) {
          const byType = new Map();
          window.lastStatusSessions.forEach((s) => {
            const key = String(s.deviceType || s.device_type || "unknown")
              .trim()
              .toLowerCase();
            byType.set(key, (byType.get(key) || 0) + 1);
          });
          labels = Array.from(byType.keys());
          data = Array.from(byType.values());
        } else {
          labels = counts.map((r) => r.device_type || "unknown");
          data = counts.map((r) =>
            Number(r.unique_sessions || r.visits || r.count || 0)
          );
        }
        
        // Show analytics card first
        analyticsCard.style.display = "block";
        
        if (!labels.length || !data.some(d => d > 0)) {
          // Hide device chart if no data
          deviceCard.style.display = "none";
          // Check if country chart is also hidden, then hide entire card
          const countryCard = document.getElementById("countryCard");
          if (countryCard && countryCard.style.display === "none") {
            analyticsCard.style.display = "none";
          }
          return;
        }
        
        // Show device card
        deviceCard.style.display = "block";
        
        // Hide loading, show chart
        const deviceChartLoading = document.getElementById("deviceChartLoading");
        const deviceChartCanvas = document.getElementById("deviceChart");
        deviceChartLoading.style.display = "none";
        deviceChartCanvas.style.display = "block";
        const ctx = deviceChartCanvas.getContext("2d");
        deviceChart = new Chart(ctx, {
          type: "pie",
          data: {
            labels,
            datasets: [
              {
                data,
                backgroundColor: labels.map(
                  (_, i) => PALETTE[i % PALETTE.length]
                ),
                borderWidth: 1,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: true, position: "bottom" },
              tooltip: {
                callbacks: {
                  label: (ctx) => {
                    const val = ctx.parsed;
                    const tot = ctx.dataset.data.reduce((a, b) => a + b, 0);
                    const pct = tot ? ((val / tot) * 100).toFixed(1) : 0;
                    return `${ctx.label}: ${val} (${pct}%)`;
                  },
                },
              },
            },
          },
        });
      };

      const buildCountryChart = (counts) => {
        if (countryChart) countryChart.destroy();
        const countryCard = document.getElementById("countryCard");
        const analyticsCard = document.getElementById("analyticsCard");
        
        // Filter out entries where country or city is "unknown" or empty
        const filtered = counts.filter((r) => {
          const country = String(r.country || "").trim().toLowerCase();
          const city = String(r.city || "").trim().toLowerCase();
          return country && city && country !== "unknown" && city !== "unknown";
        });
        
        // Show analytics card first
        analyticsCard.style.display = "block";
        
        if (filtered.length === 0) {
          // Hide only the country chart section if no valid data
          countryCard.style.display = "none";
          // Check if device chart is also hidden, then hide entire card
          const deviceCard = document.getElementById("deviceCard");
          if (deviceCard && deviceCard.style.display === "none") {
            analyticsCard.style.display = "none";
          }
          return;
        }
        
        // Show the country card
        countryCard.style.display = "block";
        
        // Hide loading, show chart
        const countryChartLoading = document.getElementById("countryChartLoading");
        const countryChartCanvas = document.getElementById("countryChart");
        countryChartLoading.style.display = "none";
        countryChartCanvas.style.display = "block";
        const ctx = countryChartCanvas.getContext("2d");
        
        // Create labels as "Country, City"
        const labels = filtered.map((r) => {
          const country = String(r.country || "").trim();
          const city = String(r.city || "").trim();
          return `${country}, ${city}`;
        });
        const data = filtered.map((r) => Number(r.visits || r.count || 0));
        
        countryChart = new Chart(ctx, {
          type: "bar",
          data: {
            labels,
            datasets: [
              {
                label: "Visits",
                data,
                backgroundColor: labels.map(
                  (_, i) =>
                    [
                      "#ef4444",
                      "#f97316",
                      "#eab308",
                      "#22c55e",
                      "#06b6d4",
                      "#3b82f6",
                      "#8b5cf6",
                      "#ec4899",
                    ][i % 8]
                ),
                borderWidth: 1,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { 
              legend: { position: "top" },
              tooltip: {
                callbacks: {
                  label: (context) => {
                    return `${context.dataset.label}: ${context.parsed.y}`;
                  }
                }
              }
            },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
          },
        });
      };

      const buildAvgDurationChart = (days) => {
        if (avgDurationChart) avgDurationChart.destroy();
        const avgDurationCard = document.getElementById("avgDurationCard");
        
        const labels = days.map((d) => d.day);
        const avgDurations = days.map((d) => {
          // Convert ms to seconds for display
          return d.avgDurationMs ? Math.round(d.avgDurationMs / 1000) : 0;
        });

        const avgDurationChartLoading = document.getElementById("avgDurationChartLoading");
        const avgDurationChartCanvas = document.getElementById("avgDurationChart");
        
        const hasAny = avgDurations.some((v) => v > 0);
        if (!hasAny) {
          avgDurationCard.style.display = "none";
          avgDurationChartLoading.style.display = "none";
          return;
        }

        avgDurationCard.style.display = "block";
        // Hide loading, show chart
        avgDurationChartLoading.style.display = "none";
        avgDurationChartCanvas.style.display = "block";
        const ctx = avgDurationChartCanvas.getContext("2d");
        
        avgDurationChart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Avg Duration (seconds)",
                data: avgDurations,
                borderColor: "#10b981",
                backgroundColor: "rgba(16, 185, 129, 0.1)",
                borderWidth: 2,
                fill: true,
                tension: 0.4,
                pointRadius: 4,
                pointHoverRadius: 6,
                pointBackgroundColor: "#10b981",
                pointBorderColor: "#ffffff",
                pointBorderWidth: 2,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                position: "top",
              },
              tooltip: {
                callbacks: {
                  label: (context) => {
                    const seconds = context.parsed.y;
                    const minutes = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    return `Avg Duration: ${minutes}m ${secs}s (${seconds}s)`;
                  },
                },
              },
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: {
                  precision: 0,
                  callback: function(value) {
                    const totalSeconds = value;
                    const hours = Math.floor(totalSeconds / 3600);
                    const minutes = Math.floor((totalSeconds % 3600) / 60);
                    const secs = totalSeconds % 60;
                    
                    if (hours > 0) {
                      // Show hours and minutes for large values
                      return minutes > 0 ? `${hours}h ${minutes}m` : `${hours}h`;
                    } else if (minutes > 0) {
                      // Show minutes and seconds for medium values
                      return secs > 0 ? `${minutes}m ${secs}s` : `${minutes}m`;
                    } else {
                      // Show only seconds for small values
                      return `${secs}s`;
                    }
                  },
                },
              },
            },
          },
        });
      };

      const buildHour = (hourBuckets) => {
        const labels = Array.from({ length: 24 }, (_, i) =>
          String(i).padStart(2, "0")
        );
        const data = labels.map((h) => hourBuckets[h] || 0);

        const hourChartLoading = document.getElementById("hourChartLoading");
        const hourChartCanvas = document.getElementById("hourChart");
        const daySelect = document.getElementById("daySelect");
        
        if (hourChart) hourChart.destroy();
        // Hide loading, show chart and selector
        hourChartLoading.style.display = "none";
        hourChartCanvas.style.display = "block";
        if (daySelect.innerHTML) daySelect.style.display = "block";
        const ctx = hourChartCanvas.getContext("2d");
        hourChart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Visits per hour (UTC)",
                data,
                backgroundColor: "#3b82f6",
                borderColor: "#2563eb",
                borderWidth: 2,
                pointBackgroundColor: "#3b82f6",
                pointBorderColor: "#2563eb",
                pointHoverBackgroundColor: "#10b981",
                pointHoverBorderColor: "#059669",
                pointHoverBorderWidth: 3,
                pointRadius: 4,
                pointHoverRadius: 6,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                ticks: {
                  precision: 0,
                },
              },
            },
            plugins: {
              legend: {
                display: true,
              },
            },
            interaction: {
              intersect: false,
              mode: "index",
            },
          },
        });
      };

      /** ====== main load - Stats (Historical Aggregated Data) ====== */
      const loadStats = async (showSpinners = true) => {
        loadBtn.disabled = true;
        hideError();
        
        // Show colorful spinners for metrics while loading (only if showSpinners is true)
        if (showSpinners) {
          totalEl.innerHTML = '<span class="spinner spinner-1"></span>';
          avgEl.innerHTML = '<span class="spinner spinner-2"></span>';
          daysEl.innerHTML = '<span class="spinner spinner-3"></span>';
          todayEl.innerHTML = '<span class="spinner spinner-4"></span>';
          monthEl.innerHTML = '<span class="spinner spinner-5"></span>';
          totalDurEl.innerHTML = '<span class="spinner spinner-6"></span>';
          
          // Show loading overlays for charts
          document.getElementById("dailyChartLoading").style.display = "flex";
          document.getElementById("dailyChart").style.display = "none";
          document.getElementById("hourChartLoading").style.display = "flex";
          document.getElementById("hourChart").style.display = "none";
          document.getElementById("daySelect").style.display = "none";
          document.getElementById("avgDurationChartLoading").style.display = "flex";
          document.getElementById("avgDurationChart").style.display = "none";
        }

        const app = appEl.value;
        const key = apiKeyEl.value || undefined;
        const from = fromEl.value;
        const to = toEl.value;

        // Validate inputs
        if (!app) {
          showError("Please select an app.");
          loadBtn.disabled = false;
          return;
        }

        let url = `${CONFIG.baseUrl}/${encodeURIComponent(app)}/stats`;
        if (from && to) url += `?from=${from}&to=${to}`;

        try {
          console.log("Loading stats from:", url);
          const data = await httpGet(url, key);
          console.log("Stats data received:", data);
          rawEl.textContent = JSON.stringify(data, null, 2);
          const days = data.days || [];
          console.log("Days found:", days.length);

          // Top stats
          const totalVisits = days.reduce(
            (a, d) => a + (d.totalVisits || 0),
            0
          );
          const totalDurationMs = days.reduce(
            (a, d) => a + (d.totalDurationMs || 0),
            0
          );
          const avgDur = Math.round(
            days.reduce((a, d) => a + (d.avgDurationMs || 0), 0) /
              (days.length || 1)
          );

          // Today and month calculations
          const today = new Date().toISOString().slice(0, 10);
          const todayData = days.find((d) => d.day === today);
          const todayVisits = todayData ? todayData.totalVisits : 0;

          // Calculate month visits (entire current month, not just selected range)
          const currentMonth = new Date().toISOString().slice(0, 7); // YYYY-MM
          let monthVisits = 0;
          
          // If the selected range includes the current month, fetch full month data
          const monthStart = currentMonth + "-01";
          const monthEnd = new Date(new Date(currentMonth + "-01").setMonth(new Date(currentMonth + "-01").getMonth() + 1) - 1).toISOString().slice(0, 10);
          
          // Check if we need to fetch month data separately
          const selectedRangeIncludesMonth = days.some(d => d.day.startsWith(currentMonth));
          if (selectedRangeIncludesMonth) {
            // Fetch full month data
            try {
              const monthData = await httpGet(
                `${CONFIG.baseUrl}/${encodeURIComponent(app)}/stats?from=${monthStart}&to=${monthEnd}`,
                key
              );
              const monthDays = (monthData.days || []).filter((d) => d.day.startsWith(currentMonth));
              monthVisits = monthDays.reduce(
                (a, d) => a + (d.totalVisits || 0),
                0
              );
            } catch (err) {
              // Fallback to selected range if fetch fails
              const monthDays = days.filter((d) => d.day.startsWith(currentMonth));
              monthVisits = monthDays.reduce(
                (a, d) => a + (d.totalVisits || 0),
                0
              );
            }
          } else {
            // Selected range doesn't include current month, so month visits is 0
            monthVisits = 0;
          }

          console.log("Updating display with:", {
            totalVisits,
            avgDur,
            daysCount: days.length,
            todayVisits,
            monthVisits,
            totalDurationMs
          });

          // Update display
          totalEl.textContent = totalVisits;
          avgEl.textContent = fmtMs(avgDur);
          daysEl.textContent = days.length;
          todayEl.textContent = todayVisits;
          monthEl.textContent = monthVisits;
          totalDurEl.textContent = fmtMs(totalDurationMs);

          // charts
          buildDaily(days);
          buildAvgDurationChart(days);

          // per-hour selector
          daySelect.innerHTML = days
            .map((d) => `<option value="${d.day}">${d.day}</option>`)
            .join("");
          daySelect.onchange = () => {
            const sel = days.find((d) => d.day === daySelect.value);
            buildHour(sel ? sel.hourBuckets : {});
          };
          if (days[0]) {
            daySelect.value = days[days.length - 1].day; // latest
            buildHour(days[days.length - 1].hourBuckets || {});
          } else {
            daySelect.innerHTML = "";
            buildHour({});
          }

          // Load analytics for country chart in background (non-blocking)
          // Real-time data from loadRealtimeStatus already shows the chart immediately
          // This is just a fallback for historical data if no real-time data exists
          httpGet(
            `${CONFIG.baseUrl}/${encodeURIComponent(app)}/analytics?from=${
              from || new Date().toISOString().slice(0, 10)
            }&to=${to || new Date().toISOString().slice(0, 10)}`,
            key
          ).then((an) => {
            // Check if we have valid countries (not "unknown")
            const validCountries = an && Array.isArray(an.countries) 
              ? an.countries.filter(c => {
                  const country = String(c.country || "").trim().toLowerCase();
                  const city = String(c.city || "").trim().toLowerCase();
                  return country && city && country !== "unknown" && city !== "unknown";
                })
              : [];
            // Only update country chart if we have historical data and no active sessions data
            // Otherwise, the real-time data from loadRealtimeStatus takes precedence
            if (validCountries.length > 0) {
              const countryCard = document.getElementById("countryCard");
              // Only update if country card is hidden (no real-time data)
              if (countryCard && countryCard.style.display === "none") {
                buildCountryChart(validCountries);
              }
            }
          }).catch((error) => {
            // Silently fail - real-time data is already showing
            console.log("Could not load analytics (non-critical):", error);
          });

          console.log("Display updated successfully");
        } catch (e) {
          console.error("Error loading stats:", e);
          showError(e.message);
          rawEl.textContent = e.stack || String(e);
          totalEl.textContent = avgEl.textContent = daysEl.textContent = "—";
          todayEl.textContent =
            monthEl.textContent =
            totalDurEl.textContent =
              "—";
          if (dailyChart) dailyChart.destroy();
          if (hourChart) hourChart.destroy();
        } finally {
          loadBtn.disabled = false;
        }
      };

      /** ====== Status (Active Sessions) - for real-time status section only ====== */
      const loadStatus = async () => {
        // This function is only for updating the real-time status section
        // It doesn't update the stats blocks or charts - that's done by loadStats()
        // This is a separate function that's called independently
      };

      /** ====== Session Management ====== */
      let currentSessionId = null;
      let heartbeatInterval = null;
      const DASHBOARD_APP = "dashboard"; // App name for tracking dashboard usage

      // Start session for dashboard tracking
      const startDashboardSession = async () => {
        try {
          const key = CONFIG.appKeys[DASHBOARD_APP] || undefined;
          // Get location before starting session
          const location = await getLocationFromIP();
          const response = await httpPost(
            `${CONFIG.baseUrl}/${DASHBOARD_APP}/start`,
            key,
            {
              country: location.country,
              city: location.city
            }
          );
          currentSessionId = response.sessionId;
          console.log("Dashboard session started:", currentSessionId, "Location:", location);
          
          // Start heartbeat interval (every 30 seconds)
          heartbeatInterval = setInterval(async () => {
            if (currentSessionId) {
              try {
                await httpPost(
                  `${CONFIG.baseUrl}/${DASHBOARD_APP}/heartbeat`,
                  key,
                  { sessionId: currentSessionId }
                );
                console.log("Dashboard heartbeat sent");
              } catch (error) {
                console.error("Heartbeat failed:", error);
              }
            }
          }, 30000); // 30 seconds
        } catch (error) {
          console.error("Failed to start dashboard session:", error);
        }
      };

      // End session when page unloads
      const endDashboardSession = async () => {
        if (currentSessionId) {
          try {
            const key = CONFIG.appKeys[DASHBOARD_APP] || undefined;
            // Use fetch with keepalive for reliability on page unload
            const headers = {
              "Content-Type": "application/json",
              ...(key ? { "x-api-key": key } : {}),
            };
            await fetch(
              `${CONFIG.baseUrl}/${DASHBOARD_APP}/end`,
              {
                method: "POST",
                headers,
                body: JSON.stringify({ sessionId: currentSessionId }),
                keepalive: true
              }
            );
            console.log("Dashboard session ended");
          } catch (error) {
            console.error("Failed to end dashboard session:", error);
          }
        }
        if (heartbeatInterval) {
          clearInterval(heartbeatInterval);
        }
      };

      // Get location from IP using a free geo-IP service
      const getLocationFromIP = async () => {
        try {
          // Try ipapi.co first (free, no key needed for basic usage)
          const response = await fetch('https://ipapi.co/json/');
          if (response.ok) {
            const data = await response.json();
            return {
              country: data.country_name || data.country || 'unknown',
              city: data.city || 'unknown'
            };
          }
        } catch (error) {
          console.log("Could not get location from ipapi.co:", error);
        }
        
        try {
          // Fallback to ip-api.com
          const response = await fetch('http://ip-api.com/json/?fields=country,city');
          if (response.ok) {
            const data = await response.json();
            return {
              country: data.country || 'unknown',
              city: data.city || 'unknown'
            };
          }
        } catch (error) {
          console.log("Could not get location from ip-api.com:", error);
        }
        
        return { country: 'unknown', city: 'unknown' };
      };

      // Track session for each app when viewing stats
      const startAppSession = async (app) => {
        try {
          const key = CONFIG.appKeys[app] || undefined;
          // Get location before starting session
          const location = await getLocationFromIP();
          const response = await httpPost(
            `${CONFIG.baseUrl}/${app}/start`,
            key,
            {
              country: location.country,
              city: location.city
            }
          );
          console.log(`Session started for app ${app}:`, response.sessionId, "Location:", location);
          return response.sessionId;
        } catch (error) {
          console.error(`Failed to start session for ${app}:`, error);
          return null;
        }
      };

      // End session for an app
      const endAppSession = async (app, sessionId) => {
        if (!sessionId) return;
        try {
          const key = CONFIG.appKeys[app] || undefined;
          await httpPost(
            `${CONFIG.baseUrl}/${app}/end`,
            key,
            { sessionId }
          );
          console.log(`Session ended for app ${app}`);
        } catch (error) {
          console.error(`Failed to end session for ${app}:`, error);
        }
      };

      // Store app sessions
      const appSessions = new Map(); // app -> { sessionId, heartbeatInterval }

      // Start session for an app and set up heartbeat
      const trackAppSession = async (app) => {
        // End previous session if exists
        if (appSessions.has(app)) {
          const prev = appSessions.get(app);
          if (prev.heartbeatInterval) {
            clearInterval(prev.heartbeatInterval);
          }
          await endAppSession(app, prev.sessionId);
        }

        // Start new session
        const sessionId = await startAppSession(app);
        if (!sessionId) return;

        // Set up heartbeat (every 30 seconds)
        const heartbeatInterval = setInterval(async () => {
          try {
            const key = CONFIG.appKeys[app] || undefined;
            await httpPost(
              `${CONFIG.baseUrl}/${app}/heartbeat`,
              key,
              { sessionId }
            );
            console.log(`Heartbeat sent for app ${app}`);
          } catch (error) {
            console.error(`Heartbeat failed for app ${app}:`, error);
          }
        }, 30000); // 30 seconds

        appSessions.set(app, { sessionId, heartbeatInterval });
      };

      /** init */
      (async () => {
        // Start dashboard session tracking
        await startDashboardSession();

        // Load API keys from database first
        await loadApiKeys();

        // default range: last 7 days
        const today = new Date();
        const endISO = today.toISOString().slice(0, 10);
        const start = new Date(today);
        start.setUTCDate(today.getUTCDate() - 6);
        const startISO = start.toISOString().slice(0, 10);
        fromEl.value = startISO;
        toEl.value = endISO;

        await setAppsUI();
        // Attach button click handler - start session, then load stats and status
        loadBtn.addEventListener("click", async () => {
          const app = appEl.value;
          if (app) {
            await trackAppSession(app);
            await loadStats();
            await loadRealtimeStatus();
          }
        });
        
        // Initial load - start session for selected app, then load stats and status
        const initialApp = appEl.value;
        if (initialApp) {
          await trackAppSession(initialApp);
          await loadStats();
          await loadRealtimeStatus();
        }

        // Theme initialization
        const savedTheme = localStorage.getItem("metrics_theme");
        if (savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          document.getElementById("themeToggle").checked = true;
        }
        document
          .getElementById("themeToggle")
          .addEventListener("change", (e) => {
            if (e.target.checked) {
              document.documentElement.setAttribute("data-theme", "dark");
              localStorage.setItem("metrics_theme", "dark");
            } else {
              document.documentElement.removeAttribute("data-theme");
              localStorage.setItem("metrics_theme", "light");
            }
          });

        // Load analytics in background (non-blocking) - real-time data already shows charts
        // This is just a fallback for historical data
        const app = document.getElementById("app").value;
        const key = document.getElementById("apiKey").value || undefined;
        httpGet(
          `${CONFIG.baseUrl}/${encodeURIComponent(app)}/analytics?from=${
            fromEl.value
          }&to=${toEl.value}`,
          key
        ).then((an) => {
          const hasDevices =
            an && Array.isArray(an.devices) && an.devices.length > 0;
          // Filter countries to only include valid ones (not "unknown")
          const validCountries = an && Array.isArray(an.countries) 
            ? an.countries.filter(c => {
                const country = String(c.country || "").trim().toLowerCase();
                const city = String(c.city || "").trim().toLowerCase();
                return country && city && country !== "unknown" && city !== "unknown";
              })
            : [];
          const hasCountries = validCountries.length > 0;
          // Only update if charts are hidden (no real-time data)
          const countryCard = document.getElementById("countryCard");
          const deviceCard = document.getElementById("deviceCard");
          if (hasDevices && deviceCard && deviceCard.style.display === "none") {
            buildDeviceChart(an.devices);
          }
          if (hasCountries && countryCard && countryCard.style.display === "none") {
            buildCountryChart(validCountries);
          }
        }).catch(() => {
          // Silently fail - real-time data is already showing
        });

        // Setup initial auto-refresh (default 10 seconds)
        setupAutoRefresh();

        // Update interval when dropdown changes
        refreshIntervalEl.addEventListener("change", setupAutoRefresh);

        // Clean up on page unload
        window.addEventListener("beforeunload", () => {
          if (refreshIntervalId) {
            clearInterval(refreshIntervalId);
          }
          endDashboardSession();
        });
        window.addEventListener("pagehide", () => {
          if (refreshIntervalId) {
            clearInterval(refreshIntervalId);
          }
          endDashboardSession();
        });
        
        // Also end all app sessions on unload
        window.addEventListener("beforeunload", () => {
          for (const [app, session] of appSessions.entries()) {
            if (session.heartbeatInterval) {
              clearInterval(session.heartbeatInterval);
            }
            // Use fetch with keepalive for reliability
            const key = CONFIG.appKeys[app] || undefined;
            const headers = {
              "Content-Type": "application/json",
              ...(key ? { "x-api-key": key } : {}),
            };
            fetch(
              `${CONFIG.baseUrl}/${app}/end`,
              {
                method: "POST",
                headers,
                body: JSON.stringify({ sessionId: session.sessionId }),
                keepalive: true
              }
            ).catch(() => {}); // Ignore errors on unload
          }
        });
      })();
    </script>
  </body>
</html>
